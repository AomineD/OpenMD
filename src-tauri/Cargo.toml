[package]
name = "openmd"
version = "0.3.0"
description = "A Markdown viewer and editor for Windows"
authors = ["AomineD"]
license = "MIT"
repository = "https://github.com/AomineD/OpenMD"
edition = "2021"

[lib]
name = "openmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
